name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    env:
      # Forțează utilizarea Node.js 24 pentru a elimina avertismentele de depreciere
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10' # Puse între ghilimele pentru a asigura interpretarea corectă a versiunii

    - name: Install system dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          git zip unzip openjdk-17-jdk \
          autoconf libtool pkg-config \
          zlib1g-dev libncurses5-dev libncursesw5-dev \
          libtinfo6 cmake build-essential \
          shared-mime-info libssl-dev

    - name: Upgrade pip
      run: |
        python -m pip install --upgrade pip

    - name: Install Python dependencies
      run: |
        pip install cython==0.29.36
        pip install buildozer

    - name: Initialize Buildozer (if needed)
      run: |
        if [ ! -f buildozer.spec ]; then
          buildozer init
        fi

    - name: Build APK
      run: |
        # Pas CRITIC: Acceptarea automată a licențelor Android SDK pentru a evita eroarea "License not accepted"
        mkdir -p $HOME/.android
        touch $HOME/.android/repositories.cfg
        # Încercăm ambele locații posibile ale sdkmanager-ului pe runner-ul GitHub
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || yes | $ANDROID_HOME/tools/bin/sdkmanager --licenses
        
        # Pornim compilarea cu log_level=2 pentru vizibilitate maximă
        buildozer --log_level=2 android debug

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: apk
        path: bin/*.apk
