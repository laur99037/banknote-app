name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install system dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          git zip unzip openjdk-17-jdk \
          autoconf libtool pkg-config \
          zlib1g-dev libncurses5-dev libncursesw5-dev \
          libtinfo6 cmake build-essential \
          shared-mime-info libssl-dev

    - name: Upgrade pip
      run: |
        python -m pip install --upgrade pip

    - name: Install Python dependencies
      run: |
        pip install cython==0.29.36
        pip install buildozer

    - name: Build APK
      run: |
        # 1. Creăm structura de directoare pe care o așteaptă Buildozer
        mkdir -p /home/runner/.buildozer/android/platform/android-sdk/tools/bin
        
        # 2. Facem link-uri către sdkmanager-ul real din sistemul GitHub
        # Aceasta rezolvă eroarea "sdkmanager path does not exist"
        ln -s $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager /home/runner/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager
        
        # 3. Acceptăm licențele în mod preventiv
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses
        
        # 4. Rulăm Buildozer
        # Folosim log_level=2 pentru a vedea progresul. 
        # NOTĂ: Nu mai folosim "yes |" aici pentru a evita "Broken pipe"
        buildozer --log_level=2 android debug

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: apk
        path: bin/*.apk
