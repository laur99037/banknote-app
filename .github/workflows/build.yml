name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install system dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          git zip unzip openjdk-17-jdk \
          autoconf libtool pkg-config \
          zlib1g-dev libncurses5-dev libncursesw5-dev \
          libtinfo6 cmake build-essential \
          shared-mime-info libssl-dev

    - name: Upgrade pip
      run: |
        python -m pip install --upgrade pip

    - name: Install Python dependencies
      run: |
        pip install cython==0.29.36
        pip install buildozer

    - name: Build APK
      run: |
        # 1. Acceptăm licențele
        mkdir -p $HOME/.android
        touch $HOME/.android/repositories.cfg
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || yes | $ANDROID_HOME/tools/bin/sdkmanager --licenses
        
        # 2. Forțăm instalarea build-tools și aflăm unde este aidl
        $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "build-tools;34.0.0" "platform-tools"
        
        # 3. CREARE LINK SIMBOLIC (Soluția pentru eroarea ta)
        # Buildozer caută aidl în propriul folder. Îi facem noi folderul înainte de pornire.
        mkdir -p /home/runner/.buildozer/android/platform/android-sdk/build-tools/34.0.0
        # Facem legătura între aidl din sistem și ce caută Buildozer
        ln -s $ANDROID_HOME/build-tools/34.0.0/aidl /home/runner/.buildozer/android/platform/android-sdk/build-tools/34.0.0/aidl
        
        # 4. Rulăm Buildozer
        # Folosim 'yes |' din nou pentru că Buildozer e încăpățânat cu licențele interne
        yes | buildozer --log_level=2 android debug

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: apk
        path: bin/*.apk
